name: backend tests

on:
  push:
    branches: [developer, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stacksniffer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/stacksniffer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"  # backend/runtime.txt
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r backend/requirements-dev.lock.txt
      - name: Create the database from the canonical schema
        working-directory: StackSniffer_R1_PostgreSQL_pgvector_Schema/stacksniffer-r1-schema
        env:
          PGPASSWORD: test
        run: |
          for f in 001_*.sql 002_*.sql 003_*.sql 004_*.sql 005_*.sql 006_*.sql 007_*.sql; do
            psql -h localhost -U postgres -d stacksniffer -X -q -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Run tests
        run: python -m pytest tests backend/tests -q -W error::DeprecationWarning
