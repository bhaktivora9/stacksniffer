name: backend tests

on:
  push:
    branches: [developer, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    # A fresh, disposable PostgreSQL per run. No secrets are referenced anywhere in this job,
    # the env files holding real database URLs are gitignored, and the test guard refuses any
    # TEST_DATABASE_URL that is not local, so neither Neon nor any remote database is reachable.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: stacksniffer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/stacksniffer
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.7"  # backend/runtime.txt

      - name: Confirm the interpreter matches the runtime pin
        run: |
          python -VV
          test "python-$(python -c 'import platform; print(platform.python_version())')" = "$(cat backend/runtime.txt)"

      - name: Install locked dependencies (hashes required)
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock.txt
          python -m pip check

      - name: Refuse any database that is not the local service
        run: |
          test -z "${DATABASE_URL:-}" && test -z "${TEST_DATABASE_ALLOWED_HOSTS:-}"
          python - <<'PY'
          import os
          from backend.tests.database_safety import unsafe_reason
          problem = unsafe_reason(os.environ["TEST_DATABASE_URL"], production_urls=[])
          assert problem is None, problem
          print("TEST_DATABASE_URL is the local disposable service")
          PY

      - name: Required grammars are ready (Java, Python, Scala)
        run: |
          python - <<'PY'
          from backend.main import DEFAULT_REQUIRED_LANGUAGES, unavailable_languages
          from backend.services.extraction.registry import AnalyzerRegistry
          required = DEFAULT_REQUIRED_LANGUAGES.split(",")
          missing = unavailable_languages(AnalyzerRegistry.default(), required)
          assert not missing, missing
          print("ready:", ", ".join(required))
          PY

      - name: Non-database suite
        env:
          TEST_DATABASE_URL: ""
        run: python -m pytest tests backend/tests -q -W error::DeprecationWarning

      - name: Create the database from the canonical schema (smoke test included)
        working-directory: StackSniffer_R1_PostgreSQL_pgvector_Schema/stacksniffer-r1-schema
        env:
          PGPASSWORD: test
        run: |
          for f in 001_*.sql 002_*.sql 003_*.sql 004_*.sql 005_*.sql 006_*.sql 007_*.sql; do
            echo "applying $f"
            psql -h localhost -U postgres -d stacksniffer -X -q -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: PostgreSQL suite against the fresh database
        run: python -m pytest tests backend/tests -q -W error::DeprecationWarning -rs

      - name: Regenerate the extraction baseline and check for drift
        run: |
          mkdir -p ci-artifacts
          python -m backend.evaluation.extraction_metrics \
            --json ci-artifacts/structural-extraction-baseline.json \
            --markdown ci-artifacts/structural-extraction-baseline.md
          python - <<'PY'
          import json
          committed = json.load(open("backend/evaluation/results/structural-extraction-baseline.json"))
          fresh = json.load(open("ci-artifacts/structural-extraction-baseline.json"))
          assert fresh == committed, "published baseline drifted; regenerate it (see extraction_metrics docstring)"
          for language, data in fresh["languages"].items():
              failing = [g["gate"] for g in data["gates"] if not g["passed"]]
              assert not failing, f"{language} fails {failing}"
          print(f"baseline v{fresh['baseline_version']} matches; gates pass for", ", ".join(fresh["languages"]))
          PY
          diff -u docs/evaluation/structural-extraction-baseline.md ci-artifacts/structural-extraction-baseline.md

      - name: Keep the baseline reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-extraction-baseline
          path: ci-artifacts/
          if-no-files-found: warn
